<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sphere-lr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC8A14"/>
      <stop offset="100%" stop-color="#1A4D23"/>
    </linearGradient>
    <radialGradient id="sphere-shine" cx="36%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-left">
      <rect x="0" y="0" width="150" height="300"/>
    </clipPath>
    <clipPath id="clip-right">
      <rect x="150" y="0" width="530" height="300"/>
    </clipPath>
  </defs>

  <!-- Back halves (dimmed, behind sphere) -->
  <ellipse cx="150" cy="150" rx="136" ry="46"
    transform="rotate(45 150 150)"
    fill="none" stroke="#1A4D23" stroke-width="8"
    clip-path="url(#clip-left)" opacity="0.28"/>

  <ellipse cx="150" cy="150" rx="136" ry="46"
    transform="rotate(135 150 150)"
    fill="none" stroke="#DC8A14" stroke-width="8"
    clip-path="url(#clip-right)" opacity="0.28"/>

  <!-- Sphere -->
  <circle cx="150" cy="150" r="36" fill="url(#sphere-lr)"/>
  <circle cx="150" cy="150" r="36" fill="url(#sphere-shine)"/>

  <!-- Front halves (full opacity, over sphere) -->
  <ellipse cx="150" cy="150" rx="136" ry="46"
    transform="rotate(45 150 150)"
    fill="none" stroke="#1A4D23" stroke-width="8"
    clip-path="url(#clip-right)"/>

  <ellipse cx="150" cy="150" rx="136" ry="46"
    transform="rotate(135 150 150)"
    fill="none" stroke="#DC8A14" stroke-width="8"
    clip-path="url(#clip-left)"/>

  <!-- Wordmark -->
  <text x="316" y="163"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="88"
    fill="#1A4D23"
    letter-spacing="2">ORBIT</text>

  <text x="320" y="196"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="22"
    fill="#2E7D3A"
    letter-spacing="1">by Oaklin</text>
</svg>
